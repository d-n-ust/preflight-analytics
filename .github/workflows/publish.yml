name: publish

# Publish to PyPI on a version tag, via PyPI Trusted Publishing (OIDC) — no API token stored
# anywhere. One-time setup on PyPI: add a "pending publisher" for project `preflight-analytics`,
# owner `d-n-ust`, repository `preflight-analytics`, workflow `publish.yml`, environment `pypi`.
# Then push a tag: `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
