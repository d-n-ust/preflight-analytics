<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="preflight reads a governed model — dbt, Cube, or MetricFlow — and preflight scan flags a SCOPE_TRAP where food_orders is orders plus a hidden filter, cited to orders.yml line 139.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="8" y="8" width="944" height="204" rx="14" fill="#faf8f5" stroke="#e6e2da" stroke-width="1.5"/>

  <!-- gather lines from the three sources into a bus, then one arrow into the scan -->
  <line x1="180" y1="56"  x2="300" y2="56"  stroke="#64748b" stroke-width="1.5"/>
  <line x1="180" y1="110" x2="300" y2="110" stroke="#64748b" stroke-width="1.5"/>
  <line x1="180" y1="164" x2="300" y2="164" stroke="#64748b" stroke-width="1.5"/>
  <line x1="300" y1="56"  x2="300" y2="164" stroke="#64748b" stroke-width="1.5"/>
  <line x1="300" y1="110" x2="376" y2="110" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="560" y1="110" x2="616" y2="110" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- three source models (any one is enough) -->
  <rect x="40" y="32"  width="140" height="48" rx="9" fill="#ffffff" stroke="#d3d2ce" stroke-width="1.4"/>
  <text x="110" y="61"  text-anchor="middle" font-size="15" font-weight="600" fill="#0f1720">dbt</text>
  <rect x="40" y="86"  width="140" height="48" rx="9" fill="#ffffff" stroke="#d3d2ce" stroke-width="1.4"/>
  <text x="110" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#0f1720">Cube</text>
  <rect x="40" y="140" width="140" height="48" rx="9" fill="#ffffff" stroke="#d3d2ce" stroke-width="1.4"/>
  <text x="110" y="169" text-anchor="middle" font-size="14" font-weight="600" fill="#0f1720">MetricFlow</text>
  <text x="110" y="207" text-anchor="middle" font-size="10.5" fill="#8a8171">governed model</text>

  <!-- preflight scan (the tool) -->
  <rect x="380" y="86" width="180" height="48" rx="9" fill="#f6ede3" stroke="#d08a5b" stroke-width="1.6"/>
  <text x="470" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#7a4a24">preflight scan</text>

  <!-- the finding -->
  <rect x="620" y="74" width="300" height="72" rx="9" fill="#fbe4e2" stroke="#d1685f" stroke-width="1.6"/>
  <text x="770" y="98"  text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.6" fill="#b0453a">SCOPE_TRAP</text>
  <text x="770" y="119" text-anchor="middle" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7a2b25">food_orders ~ orders</text>
  <text x="770" y="137" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#a86a62">orders.yml:139</text>
</svg>
